<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="logo">
    <div class="logo-icon">E</div>
    <div class="logo-text">
      <span class="logo-title">ESPRIT</span>
      <span class="logo-subtitle">Connect</span>
    </div>
  </div>

  <nav class="nav-menu">
    <ul>
      <li>
        <a routerLink="/entreprise/dashboard" routerLinkActive="active">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="label">Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/entreprise/verification" routerLinkActive="active">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12l2 2 4-4"></path>
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span class="label">Vérification</span>
        </a>
      </li>
      <li>
        <a routerLink="/entreprise/offres" routerLinkActive="active">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <span class="label">Mes Offres</span>
        </a>
      </li>
      <li>
        <a routerLink="/entreprise/candidatures" routerLinkActive="active">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="label">Candidatures</span>
        </a>
      </li>
      <li>
        <a routerLink="/entreprise/profil" routerLinkActive="active">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="label">Mon Profil</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">{{ currentUser?.nom?.substring(0, 2)?.toUpperCase() || 'EN' }}</div>
      <div class="user-details">
        <span class="user-name">{{ currentUser?.nom || 'Entreprise' }}</span>
        <span class="user-email">{{ currentUser?.email || '' }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" title="Déconnexion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</aside>
