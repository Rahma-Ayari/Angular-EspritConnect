<div class="login-page">

  <div class="login-shell">

    <!-- Panneau branding Esprit -->
    <aside class="left-panel">
      <div class="left-content">

        <div class="brand">
          <div class="brand-logo"><span>esprit</span></div>
          <p class="brand-tagline">Learn differently</p>
        </div>

        <div class="hero-text">
          <h1>Password<br><span>reset</span></h1>
          <div class="divider-line" aria-hidden="true"></div>
          <p>Choose a new secure password</p>
        </div>

      </div>
      <div class="circle circle-top" aria-hidden="true"></div>
      <div class="circle circle-bottom" aria-hidden="true"></div>
    </aside>

    <!-- Zone formulaire -->
    <main class="right-panel">
      <div class="form-card">

        <header class="form-header">
          <h1>Nouveau mot de passe</h1>
          <p>Please enter your new password below</p>
        </header>

        <div class="alert-error" *ngIf="errorMessage" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          {{ errorMessage }}
        </div>

        <div class="alert-success" *ngIf="successMessage" role="alert" style="background-color: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
          <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
          {{ successMessage }}
        </div>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMessage">

          <div class="field" [class.field-error]="isFieldInvalid('newPassword')">
            <label for="newPassword">Nouveau mot de passe</label>
            <div class="input-wrap">
              <i class="bi bi-lock" aria-hidden="true"></i>
              <input
                id="newPassword"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="newPassword"
                placeholder="••••••••"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="toggle-pwd"
                (click)="togglePassword()"
                tabindex="-1">
                <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'" aria-hidden="true"></i>
              </button>
            </div>
            <span class="error-msg" *ngIf="isFieldInvalid('newPassword')">
              <ng-container *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">Password is required.</ng-container>
              <ng-container *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Minimum 6 characters.</ng-container>
            </span>
          </div>

          <div class="field" [class.field-error]="isFieldInvalid('confirmPassword') || resetPasswordForm.errors?.['passwordMismatch']">
            <label for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <i class="bi bi-lock-fill" aria-hidden="true"></i>
              <input
                id="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="confirmPassword"
                placeholder="••••••••"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="toggle-pwd"
                (click)="toggleConfirmPassword()"
                tabindex="-1">
                <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'" aria-hidden="true"></i>
              </button>
            </div>
            <span class="error-msg" *ngIf="isFieldInvalid('confirmPassword') || (resetPasswordForm.errors?.['passwordMismatch'] && resetPasswordForm.get('confirmPassword')?.touched)">
              Passwords do not match.
            </span>
          </div>

          <button type="submit" class="btn-submit" [disabled]="isLoading || resetPasswordForm.invalid" [attr.aria-busy]="isLoading">
            <span *ngIf="!isLoading">Reset</span>
            <span *ngIf="isLoading" class="spinner" aria-label="Resetting"></span>
          </button>

        </form>

        <p class="signup-row" style="margin-top: 20px;" *ngIf="successMessage">
          <a routerLink="/login" class="btn-submit" style="display: block; text-align: center; color: white;">Log in</a>
        </p>

      </div>
    </main>

  </div>

</div>
