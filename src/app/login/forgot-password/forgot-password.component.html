<div class="login-page">

  <div class="login-shell">

    <!-- Panneau branding Esprit -->
    <aside class="left-panel">
      <div class="left-content">

        <div class="brand">
          <div class="brand-logo"><span>esprit</span></div>
          <p class="brand-tagline">Se former autrement</p>
        </div>

        <div class="hero-text">
          <h1>Mot de passe<br><span>Oublié ?</span></h1>
          <div class="divider-line" aria-hidden="true"></div>
          <p>Réinitialisez votre accès à Esprit Connect</p>
        </div>

      </div>
      <div class="circle circle-top" aria-hidden="true"></div>
      <div class="circle circle-bottom" aria-hidden="true"></div>
    </aside>

    <!-- Zone formulaire -->
    <main class="right-panel">
      <div class="form-card">

        <header class="form-header">
          <h1>Mot de passe oublié</h1>
          <p>Saisissez votre email pour recevoir un lien de réinitialisation</p>
        </header>

        <div class="alert-error" *ngIf="errorMessage" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          {{ errorMessage }}
        </div>
        
        <div class="alert-success" *ngIf="successMessage" role="alert" style="background-color: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
          <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
          {{ successMessage }}
        </div>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMessage">

          <div class="field" [class.field-error]="isFieldInvalid('email')">
            <label for="email">Email</label>
            <div class="input-wrap">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <input
                id="email"
                type="email"
                formControlName="email"
                placeholder="prenom.nom@esprit.tn"
                autocomplete="email"
              />
            </div>
            <span class="error-msg" *ngIf="isFieldInvalid('email')">
              L'email est requis et doit être valide.
            </span>
          </div>

          <app-captcha
            (verified)="onCaptchaVerified($event)"
            (verificationReset)="onCaptchaReset()"
          ></app-captcha>

          <button type="submit" class="btn-submit" [disabled]="isLoading || forgotPasswordForm.invalid || !captchaVerified" [attr.aria-busy]="isLoading">
            <span *ngIf="!isLoading">Envoyer le lien</span>
            <span *ngIf="isLoading" class="spinner" aria-label="Envoi en cours"></span>
          </button>

        </form>

        <p class="signup-row" style="margin-top: 20px;">
          <a routerLink="/login"><i class="bi bi-arrow-left"></i> Retour à la connexion</a>
        </p>

      </div>
    </main>

  </div>

</div>
