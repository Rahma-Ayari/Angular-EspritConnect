<article class="event-card" (click)="viewEvent.emit(event)">
  <div class="event-media">
    <img
      *ngIf="hasImage"
      [src]="event.imageUrl || ''"
      [alt]="event.titre"
      (error)="onImageError()"
    >
    <div class="image-placeholder" *ngIf="!hasImage">
      <i class="bi bi-calendar-event"></i>
    </div>
    <span class="status-badge" [ngClass]="statusClass">{{ event.status }}</span>
    <span class="approval-badge" *ngIf="showApprovalBadge" [ngClass]="approvalStatusClass">{{ event.approvalStatus }}</span>
  </div>

  <div class="event-content">
    <div class="event-heading">
      <h3>{{ event.titre }}</h3>
      <span class="event-type" *ngIf="event.type">{{ event.type }}</span>
    </div>

    <div class="event-meta">
      <span>
        <i class="bi bi-geo-alt"></i>
        {{ event.lieu }}
      </span>
      <span>
        <i class="bi bi-calendar3"></i>
        {{ event.dateDebut | date:'mediumDate' }} · {{ event.heureDebut }}
      </span>
      <span>
        <i class="bi bi-people"></i>
        {{ capacityLabel }}
      </span>
      <span *ngIf="event.entrepriseNom">
        <i class="bi bi-building"></i>
        {{ event.entrepriseNom }}
      </span>
    </div>

    <div class="card-actions">
      <button type="button" class="action-btn view" title="View details" (click)="viewEvent.emit(event); $event.stopPropagation()">
        <i class="bi bi-eye"></i>
      </button>
      <button type="button" class="action-btn edit" title="Edit event" (click)="editEvent.emit(event); $event.stopPropagation()">
        <i class="bi bi-pencil"></i>
      </button>
      <button type="button" class="action-btn delete" title="Delete event" (click)="deleteEvent.emit(event); $event.stopPropagation()">
        <i class="bi bi-trash"></i>
      </button>
      <button type="button" class="action-btn approve" title="Approve event" *ngIf="event.approvalStatus === 'PENDING'" (click)="approveEvent.emit(event); $event.stopPropagation()">
        <i class="bi bi-check-lg"></i>
      </button>
      <button type="button" class="action-btn reject" title="Reject event" *ngIf="event.approvalStatus === 'PENDING'" (click)="rejectEvent.emit(event); $event.stopPropagation()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
</article>
