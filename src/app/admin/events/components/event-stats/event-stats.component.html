<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon total"><i class="bi bi-calendar2-week"></i></div>
    <div><span class="stat-label">Total Events</span><strong>{{ totalEvents }}</strong></div>
  </div>

  <div class="stat-card">
    <div class="stat-icon active"><i class="bi bi-broadcast"></i></div>
    <div><span class="stat-label">Active</span><strong>{{ activeEvents }}</strong></div>
  </div>

  <div class="stat-card">
    <div class="stat-icon upcoming"><i class="bi bi-clock-history"></i></div>
    <div><span class="stat-label">Upcoming</span><strong>{{ upcomingEvents }}</strong></div>
  </div>

  <div class="stat-card">
    <div class="stat-icon capacity"><i class="bi bi-people"></i></div>
    <div><span class="stat-label">Participants</span><strong>{{ totalParticipants }}</strong></div>
  </div>

  <div class="stat-card">
    <div class="stat-icon total"><i class="bi bi-x-circle"></i></div>
    <div><span class="stat-label">Cancelled</span><strong>{{ cancelledEvents }}</strong></div>
  </div>

  <div class="stat-card">
    <div class="stat-icon active"><i class="bi bi-check2-circle"></i></div>
    <div><span class="stat-label">Completed</span><strong>{{ completedEvents }}</strong></div>
  </div>

  <div class="stat-card">
    <div class="stat-icon upcoming"><i class="bi bi-percent"></i></div>
    <div><span class="stat-label">Participation Rate</span><strong>{{ participationRate }}%</strong></div>
  </div>
</div>
