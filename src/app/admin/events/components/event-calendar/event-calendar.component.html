<div class="calendar-container">

  <h2>Upcoming Events</h2>

  <div
    class="calendar-event"
    *ngFor="let event of events"
  >

    <div class="date-box">

      <span class="day">
        {{ event.dateEvenement | date:'dd' }}
      </span>

      <span class="month">
        {{ event.dateEvenement | date:'MMM' }}
      </span>

    </div>

    <div class="event-info">

      <h3>{{ event.titre }}</h3>

      <p>{{ event.lieu }}</p>

    </div>

  </div>

</div>
