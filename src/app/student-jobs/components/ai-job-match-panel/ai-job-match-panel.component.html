<div class="match-panel" *ngIf="result && !loading">
  <div class="overall">
    <div class="ring" [style.--pct]="result.overallScore + '%'" [style.--color]="scoreColor(result.overallScore)">
      <span>{{ result.overallScore }}%</span>
    </div>
    <div>
      <h3>AI Match Score</h3>
      <p class="label">{{ label(result.overallScore) }}</p>
      <p class="rec" *ngIf="result.recommendation">{{ result.recommendation }}</p>
    </div>
  </div>

  <div class="breakdown">
    <div class="bar-row" *ngFor="let item of [
      { label: 'Skills', score: result.skillsScore },
      { label: 'Projects', score: result.projectsScore },
      { label: 'Experience', score: result.experienceScore },
      { label: 'Education', score: result.educationScore }
    ]">
      <span>{{ item.label }}</span>
      <div class="bar"><div class="fill" [style.width.%]="item.score" [style.background]="scoreColor(item.score)"></div></div>
      <span class="pct">{{ item.score }}%</span>
    </div>
  </div>

  <div class="skills-grid" *ngIf="result.matchingSkills?.length || result.missingSkills?.length">
    <div *ngIf="result.matchingSkills?.length">
      <h4>Matching Skills</h4>
      <span class="tag match" *ngFor="let s of result.matchingSkills">{{ s }}</span>
    </div>
    <div *ngIf="result.missingSkills?.length">
      <h4>Missing Skills</h4>
      <span class="tag miss" *ngFor="let s of result.missingSkills">{{ s }}</span>
    </div>
  </div>

  <div class="suggestions" *ngIf="result.improvementSuggestions?.length">
    <h4>Improvement Suggestions</h4>
    <ul>
      <li *ngFor="let s of result.improvementSuggestions">{{ s }}</li>
    </ul>
  </div>
</div>

<div class="match-loading" *ngIf="loading">
  <div class="sj-skeleton" style="height: 200px; border-radius: 12px"></div>
</div>
