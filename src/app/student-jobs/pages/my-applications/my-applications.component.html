<div class="sj-page applications-page">
  <header class="page-header-row">
    <div>
      <h1>My Applications</h1>
      <p>Track your application journey across all stages.</p>
    </div>
    <button type="button" class="sj-btn-primary" routerLink="/dashboard/jobs/discover">+ New Application</button>
  </header>

  <div class="view-toggle">
    <button type="button" [class.active]="view === 'kanban'" (click)="view = 'kanban'">Kanban</button>
    <button type="button" [class.active]="view === 'table'" (click)="view = 'table'">Table</button>
  </div>

  <div class="sj-skeleton" *ngIf="loading" style="height: 280px"></div>

  <app-application-tracker
    *ngIf="!loading"
    [applications]="applications"
    [kanbanCards]="kanbanCards"
    [view]="view"
    (openJob)="openJob($event)">
  </app-application-tracker>
</div>
