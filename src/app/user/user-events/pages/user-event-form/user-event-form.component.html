<section class="event-form-page event-background-page event-bg-form">
  <div class="page-header">
    <div>
      <p class="eyebrow">Events</p>
      <h1>{{ eventId ? 'Edit Event' : 'Create Event' }}</h1>
    </div>
    <button type="button" class="btn-secondary" routerLink="/events/mine">Back</button>
  </div>



  <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()" class="form-card">
    <div class="form-grid">
      <label>Title *<input formControlName="titre"></label>
      <label>Location *<input formControlName="lieu"></label>
      <label>Type *
        <select formControlName="typeEvenementId">
          <option [ngValue]="null">Select type</option>
          <option *ngFor="let type of eventTypes" [ngValue]="type.idTypeEvenement">{{ type.nom }}</option>
        </select>
      </label>
      <label>Start date *<input type="date" formControlName="dateDebut"></label>
      <label>Start time *<input type="time" formControlName="heureDebut"></label>
      <label>End date *<input type="date" formControlName="dateFin"></label>
      <label>End time *<input type="time" formControlName="heureFin"></label>
      <label class="checkbox"><input type="checkbox" formControlName="unlimitedParticipants"> Unlimited participants</label>
      <label *ngIf="!form.get('unlimitedParticipants')?.value">Max participants<input type="number" min="1" formControlName="capacite"></label>
      <label class="full">Image<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" (change)="onImageSelected($event)"></label>
      <img class="preview full" *ngIf="imagePreview" [src]="imagePreview" alt="">
    </div>
    <div class="form-actions">
      <button type="button" class="btn-secondary" routerLink="/events/mine">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="saving || uploading">{{ saving ? 'Saving...' : 'Save Event' }}</button>
    </div>
  </form>
</section>
