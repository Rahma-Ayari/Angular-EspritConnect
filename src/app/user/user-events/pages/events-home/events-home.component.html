<section class="events-home-page">
  <div class="events-toolbar">
    <div>
      <p class="eyebrow">Events</p>
      <h1>Events</h1>
    </div>
    <div class="toolbar-actions">
      <button type="button" routerLink="/events/participations">My Participations</button>
    </div>
  </div>

  <div class="filters">
    <input type="text" placeholder="Search events..." [(ngModel)]="search" (ngModelChange)="applyFilters()">
    <select [(ngModel)]="selectedType" (change)="applyFilters()">
      <option value="">All types</option>
      <option *ngFor="let type of eventTypes" [value]="type">{{ type }}</option>
    </select>
  </div>

  <section class="suggestions-section" *ngIf="!suggestionsLoading && suggestions.length > 0">
    <h2>Suggested Events For You</h2>
    <div class="suggestions-scroll">
      <div class="suggestion-card" *ngFor="let suggestion of suggestions">
        <div class="suggestion-header">
          <h3>{{ suggestion.category }}</h3>
          <span class="badge">{{ suggestion.interestedUsers }} interested</span>
        </div>
        <div class="suggestion-matches">
          <button type="button" class="match-chip" *ngFor="let match of suggestion.matches" (click)="navigateToEvent(match.idEvenement)">
            {{ match.titre }}
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="state" *ngIf="loading">Loading events...</div>
  <div class="state error" *ngIf="!loading && error">{{ error }}</div>
  <div class="state" *ngIf="!loading && !error && events.length === 0">No events available.</div>

  <div class="events-grid" *ngIf="!loading && !error">
    <app-user-event-card
      *ngFor="let event of events"
      [event]="event">
    </app-user-event-card>
  </div>
</section>
