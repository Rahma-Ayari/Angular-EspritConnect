<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen">
  <app-user-sidebar [collapsed]="!sidebarOpen" [activeNav]="activeNav" (navChange)="setNav($event)" (toggleSidebar)="toggleSidebar()"></app-user-sidebar>
  <main class="main-content">
    <app-user-header></app-user-header>
    <div class="content-area">
      <section class="events-home-page">
        <div class="page-header">
          <div>
            <p class="eyebrow">Events</p>
            <h1>Events</h1>
          </div>
          <button type="button" class="btn-participations" routerLink="/events/participations">
            <i class="bi bi-clipboard2-check"></i>
            My Participations
          </button>
        </div>

        <div class="filters">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search events..." [(ngModel)]="search" (ngModelChange)="applyFilters()">
          </div>
          <select [(ngModel)]="selectedType" (change)="applyFilters()">
            <option value="">All types</option>
            <option *ngFor="let type of eventTypes" [value]="type">{{ type }}</option>
          </select>
        </div>

        <div class="events-grid" *ngIf="!loading && !error && events.length > 0">
          <app-user-event-card
            *ngFor="let event of events"
            [event]="event"
            (view)="viewEvent($event)"
          ></app-user-event-card>
        </div>

        <div class="state" *ngIf="loading">Loading events...</div>
        <div class="state error" *ngIf="!loading && error">{{ error }}</div>
        <div class="state" *ngIf="!loading && !error && events.length === 0">No events available.</div>
      </section>
    </div>
  </main>
</div>
