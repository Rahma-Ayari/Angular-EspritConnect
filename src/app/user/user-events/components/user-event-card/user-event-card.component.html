<div class="event-card" (click)="openDetails()">
  <div class="event-media">
    <img
      *ngIf="event.imageUrl"
      [src]="event.imageUrl"
      [alt]="event.titre"
    >
    <div class="image-placeholder" *ngIf="!event.imageUrl">
      <i class="bi bi-calendar-event"></i>
    </div>
  </div>

  <div class="event-card-content">
    <div class="badges">
      <span class="event-status">{{ event.status }}</span>
      <span class="event-status joined" *ngIf="event.participated">Joined</span>
    </div>

    <h3>{{ event.titre }}</h3>
    <p>{{ event.lieu || 'Online event' }}</p>
    <p>{{ event.dateDebut | date:'mediumDate' }} · {{ event.heureDebut }}</p>
    <p>{{ event.unlimitedParticipants ? 'Unlimited participants' : ((event.nombreParticipants || 0) + ' / ' + event.capacite) }}</p>

    <button type="button" (click)="openDetails(); $event.stopPropagation()">
      View Details
    </button>
  </div>
</div>
