<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">E</div>
    <div class="logo-text">
      <span class="logo-title">ESPRIT</span>
      <span class="logo-subtitle">Connect</span>
    </div>
  </div>

  <nav class="nav-menu">
    <ul>
      <li *ngFor="let item of items">
        <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ng-container [ngSwitch]="item.icon">
              <path *ngSwitchCase="'dashboard'" d="M3 13h8V3H3v10zm10 8h8V3h-8v18zM3 21h8v-6H3v6z"></path>
              <path *ngSwitchCase="'profile'" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle *ngSwitchCase="'profile'" cx="12" cy="7" r="4"></circle>
              <path *ngSwitchCase="'mentoring'" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle *ngSwitchCase="'mentoring'" cx="9" cy="7" r="4"></circle>
              <path *ngSwitchCase="'mentoring'" d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
              <rect *ngSwitchCase="'jobs'" x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
              <path *ngSwitchCase="'jobs'" d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              <rect *ngSwitchCase="'events'" x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <path *ngSwitchCase="'events'" d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"></path>
              <path *ngSwitchCase="'resources'" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path *ngSwitchCase="'resources'" d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <circle *ngSwitchDefault cx="12" cy="12" r="10"></circle>
              <path *ngSwitchDefault d="M12 16v-4M12 8h.01"></path>
            </ng-container>
          </svg>
          <span class="label">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
</aside>
