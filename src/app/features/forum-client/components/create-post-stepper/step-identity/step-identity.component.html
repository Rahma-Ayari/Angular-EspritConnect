<div class="step">
  <div class="step__grid">
    <div class="field">
      <label class="field__label">Titre de la discussion <span class="field__req">*</span></label>
      <input
        class="field__input"
        type="text"
        [(ngModel)]="state.value.title"
        (ngModelChange)="state.patch({ title: $event })"
        placeholder="E.g. Tips to ace my apprenticeship interview"
      />
      <p class="field__hint">Choose a short, clear, and precise title.</p>
    </div>

    <div class="field">
      <label class="field__label">Website (optional)</label>
      <input
        class="field__input"
        type="text"
        [(ngModel)]="state.value.website"
        (ngModelChange)="state.patch({ website: $event })"
        placeholder="Ex: https://github.com/..."
      />
    </div>

    <div class="field field--full">
      <label class="field__label">Your message <span class="field__req">*</span></label>
      <textarea
        class="field__input field__textarea"
        [(ngModel)]="state.value.content"
        (ngModelChange)="state.patch({ content: $event })"
        placeholder="Explain your question or experience share with details..."
      ></textarea>
      <p class="field__hint">Tip: be specific (context, constraints, what you have already tried).</p>
    </div>

    <div class="field field--full">
      <label class="field__label">Banner (optional)</label>
      <div class="upload">
        <input type="file" accept="image/*" (change)="onCoverSelected($event)" />
        <span class="upload__meta" *ngIf="state.value.coverImageFile">
          Selected file: {{ state.value.coverImageFile.name }}
        </span>
      </div>
      <p class="field__hint">Banner is not yet sent to the backend (preview only).</p>
    </div>
  </div>

  <div class="step__actions">
    <button type="button" class="btn btn-gradient-red" (click)="next.emit()" [disabled]="!canContinue()">
      Continue
    </button>
  </div>
</div>
