<header class="header" [style.border-bottom]="currentMode !== 'admin' ? '1px solid #e2e8f0' : '1px solid #e5e7eb'">
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <input 
      type="text" 
      placeholder="Rechercher des sujets, groupes ou cours..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    >
  </div>

  <div class="header-actions">
    <!-- Messages et notifications standards -->
    <button class="icon-btn" title="Messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
    <button class="icon-btn notification" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="badge">4</span>
    </button>

    <!-- Affichage en mode Admin -->
    <ng-container *ngIf="showAdminControls">
      <span class="admin-badge" routerLink="/activity-digest">ADMIN VIEW</span>
      <div class="user-menu">
        <button class="switch-btn" (click)="toggleDropdown()">
          Switch to User
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown" *ngIf="showDropdown">
          <button type="button" class="dropdown-item" (click)="switchTo('student')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            View as Student
          </button>
          <button type="button" class="dropdown-item" (click)="switchTo('alumni')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            View as Alumni
          </button>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item logout" (click)="logout(); $event.stopPropagation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>
    </ng-container>

    <!-- Admin previewing front office -->
    <ng-container *ngIf="showAdminPreviewBar">
      <span class="user-badge" [style.background-color]="currentMode === 'student' ? '#10b981' : '#3b82f6'">
        {{ currentMode === 'student' ? 'VUE ÉTUDIANT (PREVIEW)' : 'VUE ALUMNI (PREVIEW)' }}
      </span>
      <button class="back-admin-btn" (click)="switchTo('admin')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="back-icon">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Retour Administration
      </button>
    </ng-container>

    <!-- Affichage en mode Utilisateur réel (Étudiant / Alumni / Entreprise) -->
    <ng-container *ngIf="userRole !== 'ADMIN'">
      <span class="user-badge" [style.background-color]="userRole === 'ALUMNI' ? '#3b82f6' : userRole === 'ENTREPRISE' ? '#8b5cf6' : '#10b981'">
        {{ userViewLabel }}
      </span>
    </ng-container>
  </div>
</header>
