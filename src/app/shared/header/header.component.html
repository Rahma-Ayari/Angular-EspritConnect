<header class="header" [ngClass]="{ 'admin-header': isAdmin, 'entreprise-header': isEntreprise }">
  <ng-container *ngIf="isAdmin; else entrepriseHeader">
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input
        type="text"
        placeholder="Search settings, users, or content..."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch()"
      >
    </div>

    <div class="header-actions">
      <button class="icon-btn" title="Messages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <div class="notification-menu">
        <button class="icon-btn notification" title="Notifications" (click)="toggleNotifications($event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="badge" *ngIf="unreadNotificationsCount > 0">{{ unreadNotificationsCount }}</span>
        </button>

        <div class="notifications-dropdown" *ngIf="showNotifications">
          <div class="notifications-header">
            <span>Notifications</span>
            <button type="button" class="mark-all-btn" (click)="markAllNotificationsAsRead($event)" *ngIf="notifications.length > 0">
              Tout marquer lu
            </button>
          </div>

          <div class="notifications-empty" *ngIf="notifications.length === 0">
            Aucune notification.
          </div>

          <button
            type="button"
            class="notification-item"
            *ngFor="let notification of notifications"
            [class.unread]="!notification.lue"
            (click)="markNotificationAsRead(notification, $event)">
            <div class="notification-content">{{ notification.contenu }}</div>
            <div class="notification-meta">
              <span class="notification-type">{{ notification.type }}</span>
              <span>{{ formatNotificationDate(notification.dateEnvoi) }}</span>
            </div>
          </button>
        </div>
      </div>
      <span class="admin-badge">ADMIN VIEW</span>
      <div class="user-menu">
        <button class="switch-btn" (click)="toggleDropdown()">
          Switch to User
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="dropdown" *ngIf="showDropdown">
          <a routerLink="/dashboard" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            View as Student
          </a>
          <a routerLink="/dashboard" class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            View as Alumni
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Déconnexion
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #entrepriseHeader>
    <div class="header-left">
      <h1 class="page-title">Espace Entreprise</h1>
    </div>
    <div class="header-right">
      <div class="user-menu">
        <span class="user-name">{{ currentUser?.nom || 'Entreprise' }}</span>
        <div class="user-avatar">
          {{ currentUser?.nom?.substring(0, 2)?.toUpperCase() || 'EN' }}
        </div>
      </div>
    </div>
  </ng-template>
</header>
